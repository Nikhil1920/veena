[package]
name = "rust_backend"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ort = "2.0.0-rc.12"
hound = "3"
rubato = "0.14"
rustfft = "6"
ndarray = "0.17"
num-complex = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "rust_backend"
crate-type = ["staticlib", "cdylib", "lib"]
