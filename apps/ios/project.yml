name: Veena
options:
  bundleIdPrefix: com.byanr
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  Veena:
    type: application
    platform: iOS
    sources:
      - path: Veena
    dependencies:
      - framework: frameworks/RustBackend.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.byanr.veena
        PRODUCT_NAME: Veena
        SWIFT_OBJC_BRIDGING_HEADER: Veena/Bridging/rust_backend.h
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Veena needs access to your microphone to transcribe speech to text."
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: ["UIInterfaceOrientationPortrait"]
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: ["UIInterfaceOrientationPortrait", "UIInterfaceOrientationPortraitUpsideDown", "UIInterfaceOrientationLandscapeLeft", "UIInterfaceOrientationLandscapeRight"]
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        ENABLE_USER_SCRIPT_SANDBOXING: false
        # The Rust staticlib embeds ONNX Runtime C++; its C++ runtime deps
        # are not auto-linked by the Swift-only app target.
        OTHER_LDFLAGS: "$(inherited) -lc++"
